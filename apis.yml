aid: lapse
name: Lapse
description: 'Lapse is a London-founded consumer photo company (Lapse Ltd) whose iOS
  app turns an iPhone into a disposable camera - a one-tap Lock Screen shutter, a film
  "developing" delay, and a friends-only photo journal built on a "Friends not followers"
  thesis of no ads, no data sales, and no public follower counts. The app is invite
  and friends-gated Early Access, free to use, iOS only, and screens uploads with AI
  moderation; contacts are hashed and encrypted on device. Lapse is backed by Greylock,
  GV and Speedinvest. It publishes no public API, developer portal, SDKs or documentation
  as of the July 2026 enrichment pass, so this profile captures company identity, the
  published policy and support surface, and probed security posture rather than an
  API surface.'
